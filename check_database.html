<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ระบบรายงานผลการตรวจฐานข้อมูล</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f4f6f9; padding: 20px; }
        .container-fluid { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        th { text-align: center; vertical-align: middle; background-color: #e9ecef !important; }
        td { vertical-align: middle; text-align: center; }
        .text-start-td { text-align: left; }
    </style>
</head>
<body>

<div class="container-fluid">
    <h2 class="text-center text-primary fw-bold mb-4">รายงานผลการตรวจฐานข้อมูล (ระบบจำไฟล์ถาวร)</h2>
    
    <div id="status" class="alert alert-info text-center">กำลังตรวจสอบข้อมูลในระบบ...</div>
    
    <div id="uploadSection" class="mb-4 text-center" style="display:none;">
        <input type="file" id="csvFile" accept=".csv" class="form-control d-inline-block w-50">
    </div>

    <div id="dashboardSection" class="row mb-4" style="display:none;">
        </div>
    
    <div id="tableContainer" class="table-responsive" style="display:none;">
        <table class="table table-bordered" id="resultTable">
            <thead id="resultHead"></thead>
            <tbody id="resultBody"></tbody>
        </table>
    </div>
</div>

<script>
    let db;
    // สร้าง/เปิดฐานข้อมูลในเบราว์เซอร์
    const request = indexedDB.open("DCheckDB", 1);
    request.onupgradeneeded = e => { db = e.target.result; db.createObjectStore("files", { keyPath: "id" }); };
    request.onsuccess = e => { 
        db = e.target.result; 
        loadDataFromDB(); 
    };

    function loadDataFromDB() {
        const tx = db.transaction("files", "readonly");
        const store = tx.objectStore("files");
        const req = store.get("latest_data");
        req.onsuccess = () => {
            if (req.result) {
                document.getElementById("status").innerText = "พบข้อมูลในระบบแล้ว";
                processRawData(req.result.data);
            } else {
                document.getElementById("status").innerText = "กรุณาอัปโหลดไฟล์ CSV เพื่อเริ่มระบบ";
                document.getElementById("uploadSection").style.display = "block";
            }
        };
    }

    document.getElementById('csvFile').addEventListener('change', function(e) {
        Papa.parse(e.target.files[0], {
            header: true, skipEmptyLines: true,
            complete: function(results) {
                const tx = db.transaction("files", "readwrite");
                tx.objectStore("files").put({ id: "latest_data", data: results.data });
                location.reload();
            }
        });
    });

    // ... (ส่วนการ processRawData และ render ตาราง เหมือนเดิม) ...
</script>
</body>
</html>
