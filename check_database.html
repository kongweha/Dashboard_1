<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chula AIX - Database Usage Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 p-8 min-h-screen">

    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold mb-8 text-blue-900">ระบบติดตามการใช้งานฐานข้อมูล | Chula AIX</h1>

        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 mb-8">
            <label class="block text-sm font-semibold text-gray-700 mb-3">1. อัปโหลดไฟล์ Excel (.xlsx, .xls)</label>
            <input type="file" id="uploadExcel" accept=".xlsx, .xls" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer"/>
            <p class="text-xs text-gray-400 mt-2">* โครงสร้างไฟล์ Excel ควรเป็นคอลัมน์: วันที่ (YYYY-MM-DD), ชื่อคน, ฐานข้อมูล, จำนวนการใช้งาน</p>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 mb-8">
            <label class="block text-sm font-semibold text-gray-700 mb-3">2. ตัวกรองข้อมูล (Filter)</label>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <input type="text" id="filterName" placeholder="ค้นหาชื่อคน..." class="p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                <input type="text" id="filterDB" placeholder="ค้นหาฐานข้อมูล..." class="p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                <input type="month" id="filterMonth" class="p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button id="clearFilterBtn" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-2 px-4 rounded-md transition">ล้างตัวกรอง</button>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">วันที่</th>
                            <th class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">ชื่อคน</th>
                            <th class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">ฐานข้อมูล</th>
                            <th class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">การใช้งาน (ครั้ง)</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="bg-white divide-y divide-gray-200">
                        <tr>
                            <td colspan="4" class="px-6 py-8 text-center text-sm text-gray-400">กรุณาอัปโหลดไฟล์ Excel เพื่อแสดงข้อมูล</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let excelData = []; // เก็บข้อมูลดิบทั้งหมดที่อ่านได้จาก Excel

        const uploadInput = document.getElementById('uploadExcel');
        const filterName = document.getElementById('filterName');
        const filterDB = document.getElementById('filterDB');
        const filterMonth = document.getElementById('filterMonth');
        const tableBody = document.getElementById('tableBody');
        const clearFilterBtn = document.getElementById('clearFilterBtn');

        // 1. ฟังก์ชันเมื่อมีการอัปโหลดไฟล์
        uploadInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const data = event.target.result;
                const workbook = XLSX.read(data, { type: 'binary' });
                
                // อ่านข้อมูลจาก Sheet แรก
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                
                // แปลง Sheet เป็น JSON array
                // กำหนด raw: false เพื่อให้ดึงค่าที่ format แล้ว (เช่น วันที่) ออกมาเป็น String
                excelData = XLSX.utils.sheet_to_json(worksheet, { raw: false }); 
                
                renderTable(excelData);
            };
            reader.readAsBinaryString(file);
        });

        // 2. ฟังก์ชันอัปเดตตารางตามตัวกรอง
        function applyFilters() {
            const nameVal = filterName.value.toLowerCase();
            const dbVal = filterDB.value.toLowerCase();
            const monthVal = filterMonth.value; // รูปแบบ YYYY-MM

            const filteredData = excelData.filter(row => {
                // ดึงข้อมูลจากคอลัมน์ (อ้างอิงชื่อคอลัมน์ใน Excel ของคุณ)
                const rowName = (row['ชื่อคน'] || row['Name'] || '').toString().toLowerCase();
                const rowDB = (row['ฐานข้อมูล'] || row['Database'] || '').toString().toLowerCase();
                const rowDate = (row['วันที่'] || row['Date'] || '').toString();

                const matchName = rowName.includes(nameVal);
                const matchDB = rowDB.includes(dbVal);
                let matchMonth = true;

                if (monthVal) {
                    // ตรวจสอบว่าวันที่ใน Excel มีเดือนและปีตรงกับที่ Filter หรือไม่
                    matchMonth = rowDate.includes(monthVal); 
                }

                return matchName && matchDB && matchMonth;
            });

            renderTable(filteredData);
        }

        // 3. ฟังก์ชันวาดตาราง
        function renderTable(data) {
            tableBody.innerHTML = ''; // ล้างข้อมูลเดิม

            if (data.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="4" class="px-6 py-8 text-center text-sm text-gray-500">ไม่พบข้อมูลที่ตรงกับเงื่อนไข</td></tr>`;
                return;
            }

            data.forEach(row => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-blue-50 transition-colors';
                
                tr.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${row['วันที่'] || row['Date'] || '-'}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${row['ชื่อคน'] || row['Name'] || '-'}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900 font-medium">${row['ฐานข้อมูล'] || row['Database'] || '-'}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900 text-center">${row['การใช้งาน'] || row['Hits'] || row['จำนวน'] || '0'}</td>
                `;
                tableBody.appendChild(tr);
            });
        }

        // ผูก Event Listeners กับช่อง Filter
        filterName.addEventListener('input', applyFilters);
        filterDB.addEventListener('input', applyFilters);
        filterMonth.addEventListener('change', applyFilters);

        // ปุ่มล้างตัวกรอง
        clearFilterBtn.addEventListener('click', () => {
            filterName.value = '';
            filterDB.value = '';
            filterMonth.value = '';
            renderTable(excelData);
        });
    </script>
</body>
</html>
