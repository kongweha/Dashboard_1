<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบรายงานผลการตรวจฐานข้อมูล</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f4f6f9; padding: 20px; }
        .container-fluid { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        th { text-align: center; vertical-align: middle; background-color: #e9ecef !important; border: 1px solid #dee2e6; }
        td { vertical-align: middle; text-align: center; border: 1px solid #dee2e6; }
        .text-start-td { text-align: left; font-weight: 500; }
        .filter-box { background-color: #ffffff; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #e0e0e0; }
        .table-responsive { max-height: 65vh; overflow-y: auto; }
        thead { position: sticky; top: 0; z-index: 2; }
        /* ตกแต่ง Dashboard Cards */
        .stat-card { border-radius: 10px; padding: 20px; color: white; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .stat-card h3 { font-size: 2.5rem; margin-bottom: 0; font-weight: bold; }
        .stat-card p { margin-bottom: 5px; font-size: 1.1rem; opacity: 0.9; }
    </style>
</head>
<body>

<div class="container-fluid">
    <h2 class="mb-4 text-primary text-center fw-bold">รายงานผลการตรวจฐานข้อมูลอิเล็กทรอนิกส์</h2>
    
    <div id="uploadSection" class="mb-4 col-md-6 mx-auto text-center p-4" style="border: 2px dashed #ccc; border-radius: 10px; background: #fdfdfd;">
        <label for="csvFile" class="form-label fw-bold d-block text-secondary">นำเข้าไฟล์ข้อมูล (.csv)</label>
        <input type="file" id="csvFile" accept=".csv" class="form-control mb-2">
        <small class="text-muted">* อัปโหลดเพียงครั้งเดียว ระบบจะจดจำไฟล์นี้ไว้ใช้ตลอดไป</small>
    </div>

    <div id="activeDataSection" class="alert alert-success d-flex justify-content-between align-items-center mx-auto" style="display:none !important; max-width: 900px;">
        <div>
            <span class="fw-bold fs-5">✅ ระบบพร้อมใช้งาน</span><br>
            <small>กำลังดึงข้อมูลจากฐานข้อมูลจำลอง (Local Storage)</small>
        </div>
        <button class="btn btn-outline-danger" id="clearDataBtn">🔄 อัปโหลดไฟล์ข้อมูลใหม่</button>
    </div>

    <div class="row mb-4 mx-auto" id="dashboardSection" style="display: none; max-width: 1000px;">
        <div class="col-md-4 mb-3">
            <div class="stat-card" style="background: linear-gradient(45deg, #0d6efd, #0043a8);">
                <p>ยอดการตรวจทั้งหมด</p>
                <h3 id="statTotalChecks">0</h3>
                <small>ครั้ง</small>
            </div>
        </div>
        <div class="col-md-4 mb-3">
            <div class="stat-card" style="background: linear-gradient(45deg, #198754, #0f5132);">
                <p>จำนวนฐานข้อมูล</p>
                <h3 id="statTotalDBs">0</h3>
                <small>ฐาน</small>
            </div>
        </div>
        <div class="col-md-4 mb-3">
            <div class="stat-card" style="background: linear-gradient(45deg, #0dcaf0, #087990);">
                <p>จำนวนผู้ปฏิบัติงาน</p>
                <h3 id="statTotalUsers">0</h3>
                <small>คน</small>
            </div>
        </div>
    </div>

    <div class="filter-box mx-auto shadow-sm" id="filterSection" style="display: none; max-width: 1000px;">
        <div class="row align-items-end">
            <div class="col-md-4 mb-2">
                <label class="fw-bold text-secondary">ผู้ตรวจฐานข้อมูล:</label>
                <select id="filterName" class="form-select">
                    <option value="all">-- ทั้งหมด --</option>
                </select>
            </div>
            <div class="col-md-4 mb-2">
                <label class="fw-bold text-secondary">ตั้งแต่เดือน:</label>
                <select id="filterStartMonth" class="form-select"></select>
            </div>
            <div class="col-md-4 mb-2">
                <label class="fw-bold text-secondary">ถึงเดือน:</label>
                <select id="filterEndMonth" class="form-select"></select>
            </div>
        </div>
    </div>

    <div class="table-responsive shadow-sm" id="tableContainer" style="display:none; border-radius: 8px;">
        <table class="table table-bordered table-striped table-hover m-0 bg-white">
            <thead id="resultHead"></thead>
            <tbody id="resultBody"></tbody>
        </table>
    </div>
</div>

<script>
    let globalData = [];
    let uniqueNames = new Set();
    let availableMonths = []; 

    const thaiMonths = {
        "ม.ค.":0, "ก.พ.":1, "มี.ค.":2, "เม.ย.":3, "พ.ค.":4, "มิ.ย.":5,
        "ก.ค.":6, "ส.ค.":7, "ก.ย.":8, "ต.ค.":9, "พ.ย.":10, "ธ.ค.":11
    };
    const fullMonths = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];

    // 1. ตรวจสอบข้อมูลเมื่อเปิดหน้าเว็บ
    document.addEventListener("DOMContentLoaded", function() {
        const savedData = localStorage.getItem('dcheck_saved_csv');
        if (savedData) {
            try {
                const parsedData = JSON.parse(savedData);
                processRawData(parsedData);
                toggleUploadUI(true);
            } catch (e) {
                console.error("ไม่สามารถอ่านข้อมูลที่บันทึกไว้ได้");
            }
        }
    });

    // 2. เมื่ออัปโหลดไฟล์
    document.getElementById('csvFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        Papa.parse(file, {
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                try {
                    localStorage.setItem('dcheck_saved_csv', JSON.stringify(results.data));
                    toggleUploadUI(true);
                } catch (err) {
                    alert("ไฟล์มีขนาดใหญ่เกินไป ระบบจะแสดงผลแต่ไม่จำค่าถาวร");
                }
                processRawData(results.data);
            }
        });
    });

    // 3. ปุ่มเคลียร์ไฟล์
    document.getElementById('clearDataBtn').addEventListener('click', function() {
        if(confirm("คุณต้องการล้างข้อมูลเดิม และอัปโหลดไฟล์ใหม่ใช่หรือไม่?")) {
            localStorage.removeItem('dcheck_saved_csv');
            location.reload(); 
        }
    });

    function toggleUploadUI(hasData) {
        if(hasData) {
            document.getElementById('uploadSection').style.display = 'none';
            document.getElementById('activeDataSection').style.setProperty('display', 'flex', 'important');
        } else {
            document.getElementById('uploadSection').style.display = 'block';
            document.getElementById('activeDataSection').style.setProperty('display', 'none', 'important');
        }
    }

    function parseThaiDate(dateStr) {
        if (!dateStr) return null;
        const parts = dateStr.split(' ');
        if (parts.length < 3) return null;
        
        const day = parseInt(parts[0], 10);
        const month = thaiMonths[parts[1]];
        let yearStr = parts[2];
        if (yearStr.length === 2) yearStr = "25" + yearStr; 
        const yearCE = parseInt(yearStr, 10) - 543;

        if (isNaN(day) || month === undefined || isNaN(yearCE)) return null;
        return new Date(yearCE, month, day);
    }

    function getWeekOfMonth(date) {
        const firstDate = new Date(date.getFullYear(), date.getMonth(), 1);
        const firstDay = firstDate.getDay();
        return Math.ceil((date.getDate() + firstDay - 1) / 7);
    }

    function getWeeksInMonth(year, monthIndex) {
        const lastDate = new Date(year, monthIndex + 1, 0); 
        return getWeekOfMonth(lastDate);
    }

    function processRawData(data) {
        globalData = [];
        uniqueNames.clear();
        let monthSet = new Map(); 

        data.forEach(row => {
            const name = row['ชื่อผู้ตรวจ'];
            const db = row['ชื่อฐานข้อมูล'];
            const dateStr = row['วันที่'];
            
            if (!name || !db || !dateStr) return;

            const dateObj = parseThaiDate(dateStr);
            if (!dateObj) return;

            const dayOfWeek = dateObj.getDay();
            if (dayOfWeek < 1 || dayOfWeek > 5) return;

            const monthVal = dateObj.getFullYear() * 100 + dateObj.getMonth();
            const monthStr = fullMonths[dateObj.getMonth()] + " " + (dateObj.getFullYear() + 543);
            const weekNum = getWeekOfMonth(dateObj);
            
            uniqueNames.add(name);
            if(!monthSet.has(monthVal)) {
                monthSet.set(monthVal, { val: monthVal, str: monthStr });
            }

            globalData.push({ name, db, monthVal, monthStr, week: weekNum });
        });

        availableMonths = Array.from(monthSet.values()).sort((a, b) => a.val - b.val);
        setupFilters();
        applyFilters(); 
    }

    function setupFilters() {
        const nameSelect = document.getElementById('filterName');
        const startSelect = document.getElementById('filterStartMonth');
        const endSelect = document.getElementById('filterEndMonth');

        nameSelect.innerHTML = '<option value="all">-- ทั้งหมด --</option>';
        startSelect.innerHTML = '';
        endSelect.innerHTML = '';

        Array.from(uniqueNames).sort().forEach(name => {
            nameSelect.innerHTML += `<option value="${name}">${name}</option>`;
        });

        availableMonths.forEach((m) => {
            startSelect.innerHTML += `<option value="${m.val}">${m.str}</option>`;
            endSelect.innerHTML += `<option value="${m.val}">${m.str}</option>`;
        });

        if (availableMonths.length > 0) {
            endSelect.value = availableMonths[availableMonths.length - 1].val;
            startSelect.value = availableMonths[0].val;
        }

        document.getElementById('filterSection').style.display = 'block';
    }

    document.getElementById('filterName').addEventListener('change', applyFilters);
    document.getElementById('filterStartMonth').addEventListener('change', applyFilters);
    document.getElementById('filterEndMonth').addEventListener('change', applyFilters);

    function applyFilters() {
        const selectedName = document.getElementById('filterName').value;
        let startVal = parseInt(document.getElementById('filterStartMonth').value);
        let endVal = parseInt(document.getElementById('filterEndMonth').value);

        if (startVal > endVal) {
            const temp = startVal;
            startVal = endVal;
            endVal = temp;
        }

        // กรองข้อมูลตามเงื่อนไข
        const filteredData = globalData.filter(item => {
            const matchName = (selectedName === "all" || item.name === selectedName);
            const matchMonth = (item.monthVal >= startVal && item.monthVal <= endVal);
            return matchName && matchMonth;
        });

        updateDashboard(filteredData);
        buildDynamicTable(filteredData, startVal, endVal);
    }

    // อัปเดตตัวเลขใน Dashboard
    function updateDashboard(filteredData) {
        const uniqueDBs = new Set(filteredData.map(d => d.db));
        const uniqueUsers = new Set(filteredData.map(d => d.name));
        
        document.getElementById('statTotalChecks').innerText = filteredData.length.toLocaleString();
        document.getElementById('statTotalDBs').innerText = uniqueDBs.size.toLocaleString();
        document.getElementById('statTotalUsers').innerText = uniqueUsers.size.toLocaleString();
        
        document.getElementById('dashboardSection').style.display = 'flex';
    }

    // สร้างตารางโดยบังคับแสดงทุกเดือนในช่วงที่เลือก
    function buildDynamicTable(filteredData, startVal, endVal) {
        const tableStructure = {}; 
        
        // 1. สร้างโครงสร้างทุกเดือนตั้งแต่ startVal ถึง endVal ให้ครบ
        let currentMonthVal = startVal;
        while (currentMonthVal <= endVal) {
            const yearCE = Math.floor(currentMonthVal / 100);
            const monthIdx = currentMonthVal % 100;
            const maxWeeks = getWeeksInMonth(yearCE, monthIdx); 
            const monthStr = fullMonths[monthIdx] + " " + (yearCE + 543);
            
            const allWeeks = new Set();
            for(let i = 1; i <= maxWeeks; i++) { allWeeks.add(i); }
            
            tableStructure[currentMonthVal] = { monthStr: monthStr, weeks: allWeeks };

            // ขยับไปเดือนถัดไป
            let nextMonth = monthIdx + 1;
            let nextYear = yearCE;
            if (nextMonth > 11) {
                nextMonth = 0;
                nextYear++;
            }
            currentMonthVal = nextYear * 100 + nextMonth;
        }

        const columns = Object.keys(tableStructure)
            .map(val => parseInt(val))
            .sort((a, b) => a - b)
            .map(val => {
                return {
                    monthStr: tableStructure[val].monthStr,
                    monthVal: val,
                    weeks: Array.from(tableStructure[val].weeks).sort((a, b) => a - b)
                };
            });

        // 2. รวบรวมผลนับ
        const grouped = {};
        filteredData.forEach(item => {
            const rowKey = `${item.name}|${item.db}`;
            if (!grouped[rowKey]) {
                grouped[rowKey] = { name: item.name, db: item.db, counts: {}, total: 0 };
            }
            const cellKey = `${item.monthVal}|${item.week}`;
            grouped[rowKey].counts[cellKey] = (grouped[rowKey].counts[cellKey] || 0) + 1;
            grouped[rowKey].total++;
        });

        renderHTMLTable(columns, grouped);
    }

    function renderHTMLTable(columns, grouped) {
        const thead = document.getElementById('resultHead');
        const tbody = document.getElementById('resultBody');
        thead.innerHTML = ""; tbody.innerHTML = "";

        if (Object.keys(grouped).length === 0) {
            tbody.innerHTML = `<tr><td colspan="50" class="text-center text-danger py-4">ไม่มีประวัติการตรวจในเงื่อนไขที่เลือก</td></tr>`;
            document.getElementById('tableContainer').style.display = 'block';
            return;
        }

        // หัวตารางแถว 1 (ชื่อเดือน)
        let tr1 = `<tr>
            <th rowspan="2" style="min-width: 150px;">ชื่อผู้ตรวจ</th>
            <th rowspan="2" style="min-width: 200px;">ฐานที่ตรวจ</th>`;
        
        columns.forEach(col => {
            tr1 += `<th colspan="${col.weeks.length}">${col.monthStr}</th>`;
        });
        tr1 += `<th rowspan="2" class="bg-warning">รวมทั้งหมด</th></tr>`;

        // หัวตารางแถว 2 (สัปดาห์)
        let tr2 = `<tr>`;
        columns.forEach(col => {
            col.weeks.forEach(w => {
                tr2 += `<th class="bg-light text-muted" style="min-width: 70px; font-size: 0.9rem;">สัปดาห์ ${w}</th>`;
            });
        });
        tr2 += `</tr>`;

        thead.innerHTML = tr1 + tr2;

        // วาดข้อมูล
        for (const key in grouped) {
            const row = grouped[key];
            let tr = `<tr>
                <td class="text-start-td">${row.name}</td>
                <td class="text-start-td text-secondary">${row.db}</td>`;
            
            columns.forEach(col => {
                col.weeks.forEach(w => {
                    const cellKey = `${col.monthVal}|${w}`;
                    const count = row.counts[cellKey] || 0;
                    
                    // หาก count เป็น 0 ให้แสดงผลเป็นเครื่องหมาย - แทน 
                    const displayVal = count > 0 ? count : '-';
                    const textClass = count > 0 ? 'text-primary fw-bold' : 'text-muted opacity-50';
                    
                    tr += `<td class="${textClass}">${displayVal}</td>`;
                });
            });

            tr += `<td class="bg-warning text-dark fw-bold fs-5">${row.total}</td></tr>`;
            tbody.innerHTML += tr;
        }

        document.getElementById('tableContainer').style.display = 'block';
    }
</script>

</body>
</html>
